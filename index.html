<!doctype html>
<html lang="en-GB">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solitaire</title>
<meta name="description" content="Klondike solitaire for your phone, in portrait or landscape. Draw one or draw three.">
<meta name="theme-color" content="#0F1528">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Solitaire">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #0F1528;
  --raise: #161E37;
  --raise-2: #1D2645;
  --line: rgba(205, 214, 245, .09);
  --line-2: rgba(205, 214, 245, .17);
  --ink: #ECE8DF;
  --ink-2: #A3ABC2;
  --ink-3: #6E7794;
  --sun: #F2C063;
  --sun-soft: rgba(242, 192, 99, .17);
  --on-sun: #1D1505;
  --dome-in: #0A0F21;
  --dome-out: #1A2448;
  --card: #F4F1E8;
  --card-red: #C4382E;
  --card-blk: #1A1F31;
  --card-edge: rgba(8, 12, 28, .38);
  --card-shadow: rgba(0, 0, 0, .42);
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="red"] {
  --bg: #0C0404; --raise: #160707; --raise-2: #1F0A0A;
  --line: rgba(255, 90, 70, .12); --line-2: rgba(255, 90, 70, .22);
  --ink: #E2573F; --ink-2: #A9412F; --ink-3: #74291F;
  --sun: #FF5B3D; --sun-soft: rgba(255, 91, 61, .18); --on-sun: #1A0503;
  --dome-in: #070202; --dome-out: #1E0808;
  --card: #230B0A; --card-red: #FF6A4D; --card-blk: #A9412F; --card-edge: rgba(255, 90, 70, .30); --card-shadow: rgba(0, 0, 0, .6);
}
:root[data-theme="amber"] {
  --bg: #0D0904; --raise: #171008; --raise-2: #20170C;
  --line: rgba(255, 190, 110, .10); --line-2: rgba(255, 190, 110, .20);
  --ink: #EBC48A; --ink-2: #A98A5C; --ink-3: #6F5A3B;
  --sun: #FFB04A; --sun-soft: rgba(255, 176, 74, .18); --on-sun: #1A0F02;
  --dome-in: #080502; --dome-out: #241809;
  --card: #1D150A; --card-red: #FFB04A; --card-blk: #A98A5C; --card-edge: rgba(255, 190, 110, .28); --card-shadow: rgba(0, 0, 0, .6);
}
:root[data-theme="sea"] {
  --bg: #06121A; --raise: #0B1C26; --raise-2: #102632;
  --line: rgba(150, 220, 230, .09); --line-2: rgba(150, 220, 230, .18);
  --ink: #D6E9EC; --ink-2: #8EAEB4; --ink-3: #5A7880;
  --sun: #6FD9D0; --sun-soft: rgba(111, 217, 208, .16); --on-sun: #031513;
  --dome-in: #030B10; --dome-out: #0F2A38;
}
:root[data-theme="aurora"] {
  --bg: #07110D; --raise: #0C1A14; --raise-2: #11241B;
  --line: rgba(150, 235, 190, .09); --line-2: rgba(150, 235, 190, .18);
  --ink: #D7EBDF; --ink-2: #8DAA9A; --ink-3: #5A7566;
  --sun: #86E3A8; --sun-soft: rgba(134, 227, 168, .16); --on-sun: #04140B;
  --dome-in: #040A07; --dome-out: #12291E;
}
:root[data-theme="dusk"] {
  --bg: #110D1A; --raise: #1A1426; --raise-2: #221A31;
  --line: rgba(210, 190, 255, .09); --line-2: rgba(210, 190, 255, .18);
  --ink: #E8E1F4; --ink-2: #A79CBD; --ink-3: #6E6485;
  --sun: #F2A7C8; --sun-soft: rgba(242, 167, 200, .16); --on-sun: #1E0812;
  --dome-in: #0A0712; --dome-out: #261C3A;
}
:root[data-theme="day"] {
  --bg: #E8EBF2; --raise: #FFFFFF; --raise-2: #D9DEE9;
  --line: rgba(24, 32, 64, .10); --line-2: rgba(24, 32, 64, .20);
  --ink: #161B2E; --ink-2: #4B5370; --ink-3: #69708C;
  --sun: #B8680B; --sun-soft: rgba(184, 104, 11, .14); --on-sun: #FFFFFF;
  --dome-in: #F4F6FA; --dome-out: #DCE1EC;
  --card: #FFFFFF; --card-red: #C0392B; --card-blk: #161B2E; --card-edge: rgba(24, 32, 64, .30); --card-shadow: rgba(24, 32, 64, .28);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; background: var(--bg); overscroll-behavior: none; }
body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

/* App frame */
.app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

/* Header */
.top { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand tools" "stats stats"; align-items: center; padding: 6px 16px 0; flex: none; }
.brand { grid-area: brand; min-width: 0; }
.mark { font-weight: 600; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.where { display: block; font-size: 13px; color: var(--ink-3); line-height: 1.2; margin-top: 1px; min-height: 1.2em; }
.tools { grid-area: tools; display: flex; gap: 2px; margin-right: -8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); position: relative; }
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-expanded="true"] { color: var(--sun); }
.stats { grid-area: stats; display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px 0 8px; }
.stat { display: grid; gap: 0; }
.stat:nth-child(2) { justify-items: center; }
.stat:nth-child(3) { justify-items: end; }
.stat .lab { font-size: 13px; color: var(--ink-3); line-height: 1.3; }
.stat .val { font-size: 22px; font-weight: 500; letter-spacing: -.015em; line-height: 1.15; }

/* Play area */
.stage { position: relative; flex: 1; min-height: 0; }
.board { position: absolute; inset: 0; touch-action: none; overflow: hidden; --cw: 48px; --ch: 67px; --cr: 6px; --fs: 14px; }
.slot { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: var(--cr); border: 1.5px solid var(--line-2); background: var(--line);
  display: grid; place-items: center; color: var(--ink-3); z-index: 0; }
.slot svg { width: calc(var(--cw) * .42); height: calc(var(--cw) * .42); fill: currentColor; opacity: .5; }
.slot[data-slot="stock"] svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0; width: calc(var(--cw) * .5); height: calc(var(--cw) * .5); }
.slot[data-slot="stock"].recycle { border-color: var(--sun); color: var(--sun); }
.slot[data-slot="stock"].recycle svg { opacity: 1; }
.slot[data-slot="waste"], .slot[data-slot="tab"] { background: transparent; border-style: dashed; }
.drop { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: var(--cr); pointer-events: none; z-index: 1500; opacity: 0; transition: opacity .12s;
  box-shadow: 0 0 0 2px var(--sun), 0 0 16px var(--sun-soft); background: var(--sun-soft); }
.drop.show { opacity: 1; }

/* Cards */
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); will-change: transform;
  transition: transform .26s cubic-bezier(.2, .75, .25, 1) var(--dl, 0ms), visibility 0s; }
.card.hid { visibility: hidden; transition: transform .26s cubic-bezier(.2, .75, .25, 1) var(--dl, 0ms), visibility 0s linear .34s; }
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform .3s ease; transition-delay: var(--dl, 0ms); }
.card.up .in { transform: none; }
.card .front, .card .back { position: absolute; inset: 0; border-radius: var(--cr); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 0 0 1px var(--card-edge), 0 1px 3px var(--card-shadow); }
.card .front { background: var(--card); color: var(--card-blk); overflow: hidden; }
.card .front.red { color: var(--card-red); }
.card .back { transform: rotateY(180deg); background:
  repeating-linear-gradient(45deg, var(--sun-soft) 0 2px, transparent 2px 7px),
  repeating-linear-gradient(-45deg, var(--sun-soft) 0 2px, transparent 2px 7px), var(--raise-2); }
.card .back::after { content: ""; position: absolute; inset: calc(var(--cw) * .09); border-radius: calc(var(--cr) * .6); border: 1.5px solid var(--sun-soft); }
.idx { position: absolute; left: calc(var(--cw) * .09); top: calc(var(--ch) * .05); display: flex; align-items: center; gap: calc(var(--fs) * .14);
  font: 600 var(--fs)/1 var(--sans); letter-spacing: -.03em; }
.idx svg { width: calc(var(--fs) * .88); height: calc(var(--fs) * .88); fill: currentColor; flex: none; }
.big { position: absolute; right: calc(var(--cw) * .1); bottom: calc(var(--ch) * .07); width: calc(var(--cw) * .48); height: calc(var(--cw) * .48); fill: currentColor; }
.card.drag, .card.drag .in { transition: none; }
.card.drag .front { box-shadow: 0 0 0 1px var(--card-edge), 0 8px 18px var(--card-shadow); }
.board.noanim .card, .board.noanim .card .in { transition: none !important; }
.card.shake .front, .card.shake .back { animation: shake .3s ease; }
@keyframes shake { 20% { translate: -4px 0; } 50% { translate: 4px 0; } 80% { translate: -2px 0; } }

/* Dock */
.dock { position: absolute; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 0 12px; z-index: 5; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raise-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn:disabled { opacity: .4; cursor: default; }
.dock .btn { flex: 1 1 0; max-width: 170px; min-width: 0; padding: 0 12px; }
:root[data-o="l"] .dock { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 6px; padding: 0; }
:root[data-o="l"] .dock .btn { flex: none; max-width: none; height: 40px; width: 100%; justify-content: flex-start; padding: 0 10px; gap: 6px; font-size: 13.5px; }
.btn[hidden] { display: none; }
.link-btn { color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }

/* Landscape header: one slim row */
:root[data-o="l"] .top { grid-template-columns: auto 1fr auto; grid-template-areas: "brand stats tools"; padding: 2px 12px 0; }
:root[data-o="l"] .stats { display: flex; justify-content: center; gap: 28px; padding: 0; }
:root[data-o="l"] .stat { display: flex; align-items: baseline; gap: 8px; justify-items: start; }
:root[data-o="l"] .stat .val { font-size: 19px; }
:root[data-o="l"] .where { display: none; }
:root[data-o="l"] .icon-btn { width: 40px; height: 40px; }
:root[data-o="l"] .mark { font-size: 16px; }

/* Notices */
:root[data-o="l"] #notices { display: none; }
.notice { display: flex; gap: 12px; align-items: center; margin: 4px 16px 0; padding: 8px 8px 8px 14px; border-radius: 14px; background: var(--raise); font-size: 14px; color: var(--ink-2); flex: none; }
.notice p { margin: 0; flex: 1; }
.notice .link-btn { color: var(--sun); font-weight: 600; white-space: nowrap; text-decoration: none; padding: 6px 4px; }
.notice .x { color: var(--ink-3); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.notice .x svg { width: 16px; height: 16px; }

/* Sheets */
dialog.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 88vh;
  border: 0; border-radius: 22px 22px 0 0; padding: 0; background: var(--raise); color: var(--ink);
  overflow: auto; overscroll-behavior: contain;
}
dialog.sheet[open] { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
dialog.sheet::backdrop { background: rgba(4, 6, 14, .62); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-in { padding: 10px 22px calc(28px + env(safe-area-inset-bottom)); -webkit-user-select: text; user-select: text; }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.sheet h3 { margin: 26px 0 8px; font-size: 15px; font-weight: 600; }
.sheet p { margin: 6px 0; color: var(--ink-2); font-size: 15px; }
.sheet .small, .small { font-size: 13.5px; color: var(--ink-3); }
.sheet .sub-head { margin-top: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--raise-2); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--on-sun); }
.field-row { display: flex; gap: 8px; margin-top: 10px; }
.field { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 12px; font-size: 16px; }
.field::placeholder { color: var(--ink-3); }
.rows { margin: 14px 0 0; padding: 0; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 44px; align-items: center; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 15px; }
.row:last-child { border-bottom: 0; }
.row strong { color: var(--ink); font-weight: 500; font-size: 17px; }
.row .sub { display: block; font-size: 12.5px; color: var(--ink-3); }
.best { color: var(--sun); font-size: 14px; font-weight: 500; margin: 10px 0 0; }
.score-list { margin: 6px 0 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14.5px; }
.score-list li { display: flex; justify-content: space-between; gap: 12px; min-height: 32px; align-items: center; border-bottom: 1px solid var(--line); }
.score-list li:last-child { border-bottom: 0; }
.score-list b { color: var(--ink); font-weight: 500; }

/* Popovers from the header */
.pop { position: absolute; top: 58px; right: 12px; z-index: 2000; width: min(300px, calc(100% - 24px)); padding: 16px 12px 12px; border-radius: 18px;
  background: var(--raise); border: 1px solid var(--line-2); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); animation: drop .18s ease-out; transform-origin: top right;
  max-height: calc(100% - 70px); overflow: auto; overscroll-behavior: contain; }
.pop[hidden] { display: none; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
#statsPop { width: min(320px, calc(100% - 24px)); padding: 16px 16px 12px; }
.pop-title { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.pop-note { margin: 4px 0 6px; font-size: 13px; line-height: 1.45; color: var(--ink-3); }
.switcher { display: inline-flex; padding: 3px; border-radius: 22px; background: var(--bg); margin: 0 0 4px; }
.switcher button { height: 34px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.switcher button[aria-pressed="true"] { background: var(--raise-2); color: var(--ink); }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 4px; }
.theme-opt { display: grid; justify-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
.theme-opt[aria-pressed="true"] { color: var(--ink); }
.sw { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2);
  background: radial-gradient(circle, var(--b) 0 6px, transparent 7px), radial-gradient(circle at 50% 35%, var(--c), var(--a)); }
.theme-opt[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--raise), 0 0 0 4px var(--sun); }
.theme-note { margin: 12px 4px 0; font-size: 12.5px; color: var(--ink-3); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); text-align: center; z-index: 3000; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
:root[data-o="l"] .toast { bottom: calc(18px + env(safe-area-inset-bottom)); }

/* Short screens (a phone on its side): sheets and panels use the full height and the stats sit in two columns */
@media (max-height: 460px) {
  dialog.sheet { max-height: calc(100vh - 8px); max-width: 38rem; }
  .sheet-in { padding: 8px 22px calc(14px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin-top: 14px; }
  .sheet .sub-head { margin-top: 10px; }
  .pop { max-height: calc(100% - 62px); }
  #statsPop { width: min(480px, calc(100% - 24px)); padding: 12px 16px 8px; }
  #statsPop .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; margin-top: 6px; }
  #statsPop .row { min-height: 34px; }
  #statsPop .row:nth-last-child(-n+2) { border-bottom: 0; }
  #statsPop .pop-note { margin-top: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

    <symbol id="s1" viewBox="0 0 24 24"><path d="M12 21.200C5.300 15.800 2.500 12.200 2.500 8.600c0-2.700 2.100-4.800 4.700-4.800 1.900 0 3.700 1.100 4.800 2.900 1.100-1.800 2.900-2.900 4.800-2.900 2.600 0 4.700 2.100 4.700 4.800 0 3.600-2.800 7.200-9.500 12.600Z"/></symbol>
    <symbol id="s2" viewBox="0 0 24 24"><circle cx="12" cy="7.100" r="4.500"/><circle cx="6.900" cy="14.200" r="4.500"/><circle cx="17.100" cy="14.200" r="4.500"/><path d="M12 11.500c-.1 3.600-1 6.600-3.200 9.300h6.400c-2.200-2.700-3.100-5.700-3.200-9.300Z"/></symbol>
    <symbol id="s3" viewBox="0 0 24 24"><path d="M12 2 19.800 12 12 22 4.200 12Z"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand">
      <div class="mark">Solitaire</div>
      <span class="where num" id="dealInfo"></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="themes" aria-label="Colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="icon-btn" id="statsBtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="statsPop" aria-label="Your stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="stats" role="group" aria-label="Score, moves and time">
      <div class="stat"><span class="lab">Score</span><span class="val num" id="vScore">0</span></div>
      <div class="stat"><span class="lab">Moves</span><span class="val num" id="vMoves">0</span></div>
      <div class="stat"><span class="lab">Time</span><span class="val num" id="vTime">0:00</span></div>
    </div>
  </header>
  <div class="pop" id="themes" hidden role="group" aria-label="Colour theme"></div>
  <div class="pop" id="statsPop" hidden role="dialog" aria-label="Your stats"></div>
  <div id="notices"></div>
  <main class="stage" id="stage">
    <div class="board" id="board" aria-label="Card table"></div>
    <nav class="dock" id="dock" aria-label="Game controls">
      <button class="btn" id="btnUndo" type="button" data-act="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7h6.500a4.500 4.500 0 0 1 0 9H8"/><path d="m12 4-3 3 3 3"/></svg>Undo</button>
      <button class="btn" id="btnNew" type="button" data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New deal</button>
      <button class="btn primary" id="btnAuto" type="button" data-act="auto" aria-label="Auto-complete" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.500v13l10.500-6.500Z"/></svg>Finish</button>
    </nav>
  </main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="core.js?v=1"></script>
<script>
(() => {
'use strict';
const C = window.Sol;

/* ---------- Constants ---------- */
const THEMES = [
  { id: 'twilight', name: 'Twilight', bg: '#0F1528', dome: '#1A2448', accent: '#F2C063' },
  { id: 'red', name: 'Night red', bg: '#0C0404', dome: '#1E0808', accent: '#FF5B3D' },
  { id: 'amber', name: 'Amber', bg: '#0D0904', dome: '#241809', accent: '#FFB04A' },
  { id: 'sea', name: 'Deep sea', bg: '#06121A', dome: '#0F2A38', accent: '#6FD9D0' },
  { id: 'aurora', name: 'Aurora', bg: '#07110D', dome: '#12291E', accent: '#86E3A8' },
  { id: 'dusk', name: 'Dusk', bg: '#110D1A', dome: '#261C3A', accent: '#F2A7C8' },
  { id: 'day', name: 'Daylight', bg: '#E8EBF2', dome: '#D9DEE9', accent: '#B8680B' },
];
const MAX_HIST = 400;
const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- Storage ---------- */
const P = 'sol.';   // unique per app: every app on this GitHub account shares one origin
const get = (k, d) => { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch {} };

const S = {
  set: Object.assign({ theme: 'twilight', draw: 1 }, get('settings', {})),
  stats: C.normStats(get('stats', null)),
  statMode: 1,
  g: null,          // the game: { s, hist, ms, t0, started, won, bonus, auto }
  L: null,          // table layout
  els: [], pos: [], slots: null, drops: [],
  drag: null, ptr: null,
  installEvt: null, nd: { draw: 1 },
};
if (S.set.draw !== 3) S.set.draw = 1;
if (!THEMES.some((t) => t.id === S.set.theme)) S.set.theme = 'twilight';
const saveSet = () => put('settings', S.set);
const saveStats = () => put('stats', S.stats);

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`;
};
const nf = new Intl.NumberFormat('en-GB');
const randSeed = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 999999) + 1; };

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), Math.max(2400, msg.length * 55));
}

const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  recycle: '<svg viewBox="0 0 24 24"><path d="M19.500 12a7.500 7.500 0 1 1-2.400-5.500"/><path d="M19.500 4.500v4.800h-4.800"/></svg>',
};

/* ---------- Game ---------- */
const elapsed = () => S.g.ms + (S.g.t0 ? Date.now() - S.g.t0 : 0);
function pauseClock() { const g = S.g; if (g && g.t0) { g.ms += Date.now() - g.t0; g.t0 = null; } }
function resumeClock() { const g = S.g; if (g && g.started && !g.won && !g.t0 && document.visibilityState === 'visible') g.t0 = Date.now(); }

function save() {
  const g = S.g;
  put('game', { s: g.s, hist: g.hist, ms: elapsed(), started: g.started, won: g.won, bonus: g.bonus });
}

function loadGame() {
  const saved = get('game', null);
  if (saved && !saved.won && C.validate(saved.s) && Array.isArray(saved.hist)) {
    S.g = { s: saved.s, hist: saved.hist.filter((h) => C.validate(h)).slice(-MAX_HIST), ms: +saved.ms || 0, t0: null, started: !!saved.started, won: false, bonus: 0, auto: false };
    resumeClock();
    return true;
  }
  return false;
}

function freshGame(seed, draw) {
  S.g = { s: C.deal(seed, draw), hist: [], ms: 0, t0: null, started: false, won: false, bonus: 0, auto: false };
}

function newGame(seed, draw) {
  const g = S.g;
  if (g && g.started && !g.won) { C.statAbandon(S.stats, g.s.draw); saveStats(); }
  pauseClock();
  freshGame(seed, draw);
  S.statMode = draw;
  save();
  dealAnimation();
  updateHud(); updateDock();
}

// Everything starts on the stock, then the columns are dealt out one card at a time
function dealAnimation() {
  const b = $('#board'), s = S.g.s, L = S.L;
  if (!L) return;
  b.classList.add('noanim');
  for (let id = 0; id < 52; id++) {
    const el = S.els[id];
    el.classList.remove('up'); el.style.zIndex = 10;
    el.style.transform = `translate3d(${L.stock.x}px,${L.stock.y}px,0)`;
    el.style.setProperty('--dl', '0ms');
  }
  S.pos = [];
  void b.offsetWidth;
  b.classList.remove('noanim');
  let order = 0;
  for (let r = 0; r < 7; r++) for (let i = r; i < 7; i++) { S.els[s.tab[i][r]].style.setProperty('--dl', `${order * 24}ms`); order++; }
  place(true);
  setTimeout(() => S.els.forEach((el) => el.style.removeProperty('--dl')), 1500);
}

/* Applying an action: keep an undo snapshot, change the state, redraw, save */
function act(fn) {
  const g = S.g;
  if (g.won || g.auto) return false;
  const snap = C.clone(g.s);
  if (!fn(g.s)) return false;
  g.hist.push(snap);
  if (g.hist.length > MAX_HIST) g.hist.shift();
  begin();
  place(true); updateHud(); afterMove(); save();
  return true;
}
function begin() {
  const g = S.g;
  if (g.started) return;
  g.started = true; g.t0 = Date.now();
  C.statStart(S.stats, g.s.draw); saveStats();
  const dis = get('dismissed', {});
  if (!dis.hint) { dis.hint = 1; put('dismissed', dis); renderNotices(); }
}
const doMove = (from, to) => act((s) => { if (!C.canMove(s, from, to)) return false; C.applyMove(s, from, to); return true; });
const doDraw = () => act((s) => !!C.drawCards(s));

function afterMove() {
  const g = S.g;
  if (!g.won && C.isWon(g.s)) win();
  updateDock();
}

function undo() {
  const g = S.g;
  if (g.won || g.auto || !g.hist.length) return;
  g.s = g.hist.pop();
  place(true); updateHud(); updateDock(); save();
}

function runAuto() {
  const g = S.g;
  if (g.won || g.auto || !C.canAutoComplete(g.s)) return;
  g.hist.push(C.clone(g.s)); if (g.hist.length > MAX_HIST) g.hist.shift();   // one undo takes back the lot
  g.auto = true; begin(); updateDock();
  const step = () => {
    const st = C.autoStep(g.s);
    if (!st) { g.auto = false; afterMove(); save(); return; }
    C.applyMove(g.s, st.from, st.to);
    place(true); updateHud();
    if (C.isWon(g.s)) { g.auto = false; afterMove(); save(); return; }
    setTimeout(step, 90);
  };
  step();
}

function win() {
  const g = S.g;
  pauseClock();
  g.won = true;
  g.bonus = C.timeBonus(g.ms);
  g.s.score += g.bonus;
  g.hist = [];
  const flags = C.statWin(S.stats, g.s.draw, { score: g.s.score, ms: g.ms, moves: g.s.moves });
  saveStats();
  updateHud(); updateDock();
  put('game', { s: g.s, hist: [], ms: g.ms, started: true, won: true, bonus: g.bonus });
  setTimeout(() => { if (S.g === g) openWin(flags); }, 700);
}

/* ---------- Drawing the table ---------- */
function buildBoard() {
  const b = $('#board');
  b.innerHTML = '';
  const mk = (cls, data, inner) => {
    const d = document.createElement('div');
    d.className = cls;
    Object.assign(d.dataset, data || {});
    if (inner) d.innerHTML = inner;
    b.appendChild(d);
    return d;
  };
  S.slots = {
    stock: mk('slot', { slot: 'stock' }, ICON.recycle),
    waste: mk('slot', { slot: 'waste' }),
    found: [0, 1, 2, 3].map((q) => mk('slot', { slot: 'found', i: q }, `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s${q}"/></svg>`)),
    tab: [0, 1, 2, 3, 4, 5, 6].map((i) => mk('slot', { slot: 'tab', i })),
  };
  S.els = [];
  for (let id = 0; id < 52; id++) {
    const sv = C.suit(id), red = C.isRed(id), r = C.RANK_LABEL[C.rank(id) - 1];
    const el = mk('card', { id }, `<div class="in"><div class="front${red ? ' red' : ''}"><span class="idx"><span>${r}</span><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s${sv}"/></svg></span>` +
      `<svg class="big" viewBox="0 0 24 24" aria-hidden="true"><use href="#s${sv}"/></svg></div><div class="back"></div></div>`);
    el.setAttribute('role', 'img');
    S.els.push(el);
  }
  S.drops = Array.from({ length: 11 }, () => mk('drop'));
}

// Where every card should be right now
function wanted(s, L) {
  const want = new Array(52);
  s.stock.forEach((id, i) => { want[id] = { x: L.stock.x, y: L.stock.y, z: 10 + i, up: false, zone: 'stock', i: 0, k: i, hid: i < s.stock.length - 2 }; });
  const vis = s.draw === 3 ? Math.min(3, s.waste.length) : Math.min(1, s.waste.length);
  s.waste.forEach((id, j) => {
    const rel = s.waste.length - 1 - j;
    want[id] = { x: L.waste.x + (rel < vis ? (vis - 1 - rel) * L.fan : 0), y: L.waste.y, z: 200 + j, up: true, zone: 'waste', i: 0, k: j, hid: rel > vis };
  });
  s.found.forEach((f, q) => f.forEach((id, k) => { want[id] = { x: L.found[q].x, y: L.found[q].y, z: 300 + k, up: true, zone: 'found', i: q, k, hid: k < f.length - 2 }; }));
  s.tab.forEach((p, i) => {
    const ys = C.pileYs(L, p.length, s.up[i]);
    p.forEach((id, k) => { want[id] = { x: L.tab[i].x, y: ys[k], z: 100 + k, up: k >= p.length - s.up[i], zone: 'tab', i, k }; });
  });
  return want;
}

function place(animate) {
  const g = S.g, L = S.L;
  if (!g || !L) return;
  const want = wanted(g.s, L), held = S.drag ? S.drag.ids : [];
  let flying = false;
  for (let id = 0; id < 52; id++) {
    const w = want[id], el = S.els[id], old = S.pos[id];
    if (!held.includes(id)) {
      const moved = !old || old.x !== w.x || old.y !== w.y;
      el.style.transform = `translate3d(${w.x.toFixed(1)}px,${w.y.toFixed(1)}px,0)`;
      if (animate && moved) { el.style.zIndex = 600 + w.z; flying = true; } else el.style.zIndex = w.z;
    }
    if (!old || old.up !== w.up) {
      el.classList.toggle('up', w.up);
      el.setAttribute('aria-label', w.up ? C.cardName(id) : 'Face-down card');
    }
    if (!old || !!old.hid !== !!w.hid) el.classList.toggle('hid', !!w.hid);
    S.pos[id] = w;
  }
  if (flying) {
    clearTimeout(S.flyT);
    S.flyT = setTimeout(() => { for (let id = 0; id < 52; id++) if (!S.drag || !S.drag.ids.includes(id)) S.els[id].style.zIndex = S.pos[id].z; }, 340);
  }
  S.slots.stock.classList.toggle('recycle', g.s.stock.length === 0 && g.s.waste.length > 0);
}

function sync() {
  const land = innerWidth > innerHeight;
  const root = document.documentElement;
  const o = land ? 'l' : 'p';
  if (root.dataset.o !== o) root.dataset.o = o;
  const st = $('#stage'), W = st.clientWidth, H = st.clientHeight;
  if (!W || !H || !S.g) return;
  const L = C.layout({ W, H, land, dockH: 60 });
  S.L = L;
  const b = $('#board');
  b.style.setProperty('--cw', `${L.w.toFixed(1)}px`);
  b.style.setProperty('--ch', `${L.h.toFixed(1)}px`);
  b.style.setProperty('--cr', `${(L.w * 0.12).toFixed(1)}px`);
  b.style.setProperty('--fs', `${L.fs.toFixed(1)}px`);
  const at = (el, p) => { el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0)`; };
  at(S.slots.stock, L.stock); at(S.slots.waste, L.waste);
  L.found.forEach((p, q) => at(S.slots.found[q], p));
  L.tab.forEach((p, i) => at(S.slots.tab[i], p));
  const d = $('#dock');
  d.style.left = `${L.dock.x}px`; d.style.top = `${L.dock.y}px`; d.style.width = `${L.dock.w}px`; d.style.height = `${L.dock.h}px`;
  b.classList.add('noanim');
  place(false);
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.remove('noanim')));
}

function updateHud() {
  const g = S.g, s = g.s;
  $('#vScore').textContent = nf.format(s.score);
  $('#vMoves').textContent = nf.format(s.moves);
  $('#vTime').textContent = fmtTime(elapsed());
  $('#dealInfo').textContent = `Deal ${s.seed}, draw ${s.draw}`;
}
function updateDock() {
  const g = S.g;
  $('#btnUndo').disabled = g.won || g.auto || !g.hist.length;
  $('#btnAuto').hidden = !(!g.won && !g.auto && C.canAutoComplete(g.s));
}

/* ---------- Touch and mouse ---------- */
function fromOf(pos) {
  const s = S.g.s;
  if (pos.zone === 'waste') return pos.k === s.waste.length - 1 ? { k: 'w' } : null;
  if (pos.zone === 'found') return pos.k === s.found[pos.i].length - 1 ? { k: 'f', s: pos.i } : null;
  if (pos.zone === 'tab') { const p = s.tab[pos.i]; return pos.k >= p.length - s.up[pos.i] ? { k: 't', i: pos.i, n: p.length - pos.k } : null; }
  return null;
}
function idsOf(from) {
  const s = S.g.s;
  if (from.k === 't') return s.tab[from.i].slice(s.tab[from.i].length - from.n);
  return C.movingCards(s, from) || [];
}

function targets(from) {
  const s = S.g.s, L = S.L, out = [];
  for (let q = 0; q < 4; q++) if (C.canMove(s, from, { k: 'f', s: q })) out.push({ to: { k: 'f', s: q }, x: L.found[q].x, y: L.found[q].y });
  for (let i = 0; i < 7; i++) {
    if (!C.canMove(s, from, { k: 't', i })) continue;
    const p = s.tab[i], y = p.length ? S.pos[p[p.length - 1]].y : L.tab[i].y;
    out.push({ to: { k: 't', i }, x: L.tab[i].x, y });
  }
  return out;
}
function showDrops(list) {
  S.drops.forEach((d, n) => {
    const t = list[n];
    if (t) { d.style.transform = `translate3d(${t.x.toFixed(1)}px,${t.y.toFixed(1)}px,0)`; d.classList.add('show'); } else d.classList.remove('show');
  });
}

function pickTarget(list, cx, cy, px, py) {
  const L = S.L, m = L.w * 0.25;
  // foundations: the card or the finger over the slot
  for (const t of list) {
    if (t.to.k !== 'f') continue;
    const x0 = t.x - m, x1 = t.x + L.w + m, y0 = t.y - m, y1 = t.y + L.h + m;
    if ((cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1) || (px >= x0 && px <= x1 && py >= y0 && py <= y1)) return t.to;
  }
  // columns: the band under the card, from just above the first card down to the bottom
  const half = Math.max(0, (L.pitch - L.w) / 2);
  const top = L.tabY - L.h * 0.4;
  let best = null, bestD = 1e9;
  for (const t of list) {
    if (t.to.k !== 't') continue;
    const x0 = t.x - half, x1 = t.x + L.w + half, mid = t.x + L.w / 2;
    const inCard = cx >= x0 && cx <= x1 && cy >= top, inFinger = px >= x0 && px <= x1 && py >= top;
    if (!inCard && !inFinger) continue;
    const dist = Math.min(Math.abs(cx - mid), Math.abs(px - mid));
    if (dist < bestD) { bestD = dist; best = t.to; }
  }
  return best;
}

function shake(ids) {
  ids.forEach((id) => { const el = S.els[id]; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
  setTimeout(() => ids.forEach((id) => S.els[id].classList.remove('shake')), 340);
}

function onTap(press) {
  if (press.stock) { doDraw(); return; }
  const from = press.from;
  if (!from) return;
  const to = C.tapTarget(S.g.s, from);
  if (to) doMove(from, to); else shake(press.ids);
}

const board = $('#board');
board.addEventListener('pointerdown', (e) => {
  if (popOpen()) { closePops(); S.ptr = { id: e.pointerId, ignore: true }; return; }   // a tap outside a panel only closes it
  if (S.ptr || S.g.won || S.g.auto || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const cardEl = e.target.closest('.card'), slotEl = e.target.closest('.slot');
  let press = null;
  if (cardEl) {
    const id = +cardEl.dataset.id, pos = S.pos[id];
    if (pos.zone === 'stock') press = { stock: true };
    else { const from = fromOf(pos); if (from) press = { from, ids: idsOf(from) }; }
  } else if (slotEl && slotEl.dataset.slot === 'stock') press = { stock: true };
  if (!press) return;
  press.id = e.pointerId; press.sx = e.clientX; press.sy = e.clientY;
  S.ptr = press;
  try { board.setPointerCapture(e.pointerId); } catch {}
});

function startDrag(press) {
  const r = $('#board').getBoundingClientRect();
  press.r = r;
  press.base = press.ids.map((id) => ({ x: S.pos[id].x, y: S.pos[id].y }));
  press.list = targets(press.from);
  S.drag = { ids: press.ids };
  press.ids.forEach((id, n) => { const el = S.els[id]; el.classList.add('drag'); el.style.zIndex = 2000 + n; });
  showDrops(press.list);
  press.dragging = true;
}

board.addEventListener('pointermove', (e) => {
  const p = S.ptr;
  if (!p || p.ignore || p.id !== e.pointerId || p.stock || !p.from) return;
  const dx = e.clientX - p.sx, dy = e.clientY - p.sy;
  if (!p.dragging) {
    if (Math.hypot(dx, dy) < (e.pointerType === 'mouse' ? 4 : 8)) return;
    startDrag(p);
  }
  p.ids.forEach((id, n) => { S.els[id].style.transform = `translate3d(${(p.base[n].x + dx).toFixed(1)}px,${(p.base[n].y + dy).toFixed(1)}px,0)`; });
  p.last = { dx, dy };
});

function endPress(e, cancelled) {
  const p = S.ptr;
  if (!p || p.id !== e.pointerId) return;
  S.ptr = null;
  try { board.releasePointerCapture(e.pointerId); } catch {}
  if (p.ignore) return;
  if (p.dragging) {
    const ids = p.ids;
    ids.forEach((id) => S.els[id].classList.remove('drag'));
    S.drag = null;
    showDrops([]);
    let moved = false;
    if (!cancelled && p.last) {
      const cx = p.base[0].x + p.last.dx + S.L.w / 2, cy = p.base[0].y + p.last.dy + S.L.h / 2;
      const to = pickTarget(p.list, cx, cy, e.clientX - p.r.left, e.clientY - p.r.top);
      if (to) moved = doMove(p.from, to);
    }
    if (!moved) { ids.forEach((id) => { S.pos[id] = null; }); place(true); }   // slide back
    return;
  }
  if (!cancelled) onTap(p);
}
board.addEventListener('pointerup', (e) => endPress(e, false));
board.addEventListener('pointercancel', (e) => endPress(e, true));
board.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- Themes ---------- */
function themeGridHtml() {
  return `<div class="theme-grid">${THEMES.map((t) => `<button class="theme-opt" type="button" data-theme="${t.id}" aria-pressed="${S.set.theme === t.id}">
      <span class="sw" style="--a:${t.bg};--c:${t.dome};--b:${t.accent}"></span>${t.name}</button>`).join('')}</div>
    <p class="theme-note">Night red and Amber are gentlest on eyes adjusted to the dark.</p>`;
}
function setTheme(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  S.set.theme = t.id; saveSet();
  if (t.id === 'twilight') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t.id;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.bg);
  document.querySelectorAll('.theme-opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === t.id)));
}

/* ---------- Panels from the header ---------- */
function statsPopHtml() {
  const mode = S.statMode, m = S.stats[mode === 3 ? 'd3' : 'd1'];
  const rate = m.played ? Math.round((100 * m.won) / m.played) : 0;
  const dash = '–';
  const row = (l, v) => `<div class="row"><span>${l}</span><strong class="num">${v}</strong></div>`;
  return `<h2 class="pop-title">Your stats</h2>
    <div class="switcher" role="group" aria-label="Cards drawn">
      <button type="button" data-statmode="1" aria-pressed="${mode === 1}">Draw 1</button>
      <button type="button" data-statmode="3" aria-pressed="${mode === 3}">Draw 3</button></div>
    <div class="rows">
      ${row('Played', nf.format(m.played))}${row('Won', nf.format(m.won))}${row('Win rate', m.played ? rate + '%' : dash)}
      ${row('Current streak', nf.format(m.streak))}${row('Best streak', nf.format(m.bestStreak))}
      ${row('Best score', m.won ? nf.format(m.bestScore) : dash)}${row('Best time', m.won ? fmtTime(m.bestTime) : dash)}${row('Fewest moves', m.won ? nf.format(m.bestMoves) : dash)}
    </div>
    <p class="pop-note">A game counts as played from its first move. Stats stay on this phone.</p>`;
}
const POPS = { themes: '#themeBtn', statsPop: '#statsBtn' };
function togglePop(id, open) {
  const pop = $('#' + id);
  const show = open == null ? pop.hidden : open;
  for (const other in POPS) if (other !== id && !$('#' + other).hidden) togglePop(other, false);
  if (show) {
    if (id === 'statsPop') S.statMode = S.g.s.draw;
    pop.innerHTML = id === 'themes' ? themeGridHtml() : statsPopHtml();
    const app = $('#app').getBoundingClientRect(), top = $('#top').getBoundingClientRect();
    pop.style.top = `${Math.round($(POPS[id]).getBoundingClientRect().bottom - app.top + 4)}px`;
  }
  pop.hidden = !show;
  $(POPS[id]).setAttribute('aria-expanded', String(show));
}
function closePops() { for (const id in POPS) if (!$('#' + id).hidden) togglePop(id, false); }
const popOpen = () => Object.keys(POPS).some((id) => !$('#' + id).hidden);

// With a panel open, a tap anywhere outside it only closes the panel and never also presses what is underneath
document.addEventListener('click', (e) => {
  if (!popOpen() || e.target.closest('.pop, ' + Object.values(POPS).join(', '))) return;
  e.preventDefault(); e.stopPropagation();
  closePops();
}, true);

/* ---------- Sheets ---------- */
const sheet = $('#sheet');
function openSheet(html) {
  closePops();
  $('#sheetBody').innerHTML = `<div class="grabber"></div>` + html;
  if (!sheet.open) sheet.showModal();
}
function closeSheet() { if (sheet.open) sheet.close(); }
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
const head = (title) => `<div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="icon-btn" type="button" data-act="close" aria-label="Close">${ICON.x}</button></div>`;

function drawChips() {
  return `<div class="chips" role="group" aria-label="Cards drawn">${[1, 3].map((n) => `<button class="chip" type="button" data-draw="${n}" aria-pressed="${S.nd.draw === n}">Draw ${n}</button>`).join('')}</div>`;
}
function openNewDeal() {
  const g = S.g, s = g.s;
  S.nd = { draw: S.set.draw };
  const streak = S.stats[s.draw === 3 ? 'd3' : 'd1'].streak;
  const warn = g.started && !g.won && streak > 0 ? `<p>Deal ${s.seed} isn’t finished. Starting another ends your win streak.</p>` : '';
  openSheet(head('New deal') + warn + `
    <p class="small sub-head">Cards drawn</p>${drawChips()}
    <div class="actions"><button class="btn primary" type="button" data-act="deal-new">New random deal</button>
    ${g.started ? `<button class="btn" type="button" data-act="deal-replay">Replay deal ${s.seed}</button>` : ''}</div>
    <h3>Play a deal number</h3>
    <form class="field-row" id="dealForm"><input class="field num" id="dealIn" inputmode="numeric" pattern="[0-9]*" placeholder="1 to 999999" autocomplete="off" aria-label="Deal number"><button class="btn" type="submit">Play</button></form>
    <p class="small">The same number and draw setting always give the same deal, so you can share one.</p>`);
}
function openSettings() {
  openSheet(head('Settings') + `
    <h3>Colour theme</h3>${themeGridHtml()}
    <h3>How scoring works</h3>
    <ul class="score-list">
      <li><span>Waste to a column</span><b class="num">+5</b></li>
      <li><span>Any card to a foundation</span><b class="num">+10</b></li>
      <li><span>Turning over a column card</span><b class="num">+5</b></li>
      <li><span>Foundation back to a column</span><b class="num">−15</b></li>
      <li><span>Each pass through the stock after the first (draw 1)</span><b class="num">−100</b></li>
      <li><span>Each pass after the third (draw 3)</span><b class="num">−20</b></li>
    </ul>
    <p class="small">Winning adds a time bonus of 700,000 divided by your seconds, if you took 30 seconds or more. The score never goes below zero.</p>
    <h3>Stats</h3>
    <p class="small">Played, wins and bests are kept on this phone only.</p>
    <div class="actions"><button class="btn" type="button" data-act="reset-stats">Reset stats</button></div>
    <p class="small" style="margin-top:22px">Solitaire, release 1.</p>`);
}
function openWin(flags) {
  const g = S.g, s = g.s;
  const bests = [];
  if (!flags.first) {
    if (flags.score) bests.push('New best score.');
    if (flags.time) bests.push('New best time.');
    if (flags.moves) bests.push('Fewest moves yet.');
  }
  const m = S.stats[s.draw === 3 ? 'd3' : 'd1'];
  openSheet(head('You won') + `<p>Deal ${s.seed}, draw ${s.draw}.</p>
    <div class="rows">
      <div class="row"><span>Score${g.bonus ? `<span class="sub">Includes ${nf.format(g.bonus)} for your time</span>` : ''}</span><strong class="num">${nf.format(s.score)}</strong></div>
      <div class="row"><span>Moves</span><strong class="num">${nf.format(s.moves)}</strong></div>
      <div class="row"><span>Time</span><strong class="num">${fmtTime(g.ms)}</strong></div>
      <div class="row"><span>Win streak</span><strong class="num">${nf.format(m.streak)}</strong></div>
    </div>
    ${bests.length ? `<p class="best">${bests.join(' ')}</p>` : ''}
    <div class="actions"><button class="btn primary" type="button" data-act="deal-new">New random deal</button><button class="btn" type="button" data-act="deal-replay">Replay this deal</button></div>`);
  S.nd = { draw: s.draw };
}

/* ---------- Notices ---------- */
let installEvt = null;
function renderNotices() {
  const out = [], dismissed = get('dismissed', {});
  if (!standalone && !dismissed.install) {
    if (installEvt) out.push(`<div class="notice"><p>Add Solitaire to your home screen for one-tap access.</p><button class="link-btn" type="button" data-act="install">Install</button><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
    else if (isIOS) out.push(`<div class="notice"><p>Add Solitaire to your Home Screen: tap Share, then Add to Home Screen.</p><button class="x" type="button" data-dismiss="install" aria-label="Dismiss">${ICON.x}</button></div>`);
  }
  if (!dismissed.hint && !out.length) out.push(`<div class="notice"><p>Tap a card to send it where it fits, or drag it to choose.</p><button class="x" type="button" data-dismiss="hint" aria-label="Dismiss">${ICON.x}</button></div>`);
  $('#notices').innerHTML = out.join('');
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; renderNotices(); });

/* ---------- Events ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.theme) { setTheme(d.theme); return; }
  if (d.draw) {
    S.nd.draw = +d.draw; S.set.draw = S.nd.draw; saveSet();
    t.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === t)));
    return;
  }
  if (d.statmode) { S.statMode = +d.statmode; $('#statsPop').innerHTML = statsPopHtml(); return; }
  if (d.dismiss) { const x = get('dismissed', {}); x[d.dismiss] = 1; put('dismissed', x); renderNotices(); sync(); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'undo': undo(); break;
    case 'new': openNewDeal(); break;
    case 'auto': runAuto(); break;
    case 'deal-new': closeSheet(); newGame(randSeed(), S.nd.draw); break;
    case 'deal-replay': closeSheet(); newGame(S.g.s.seed, S.nd.draw); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; renderNotices(); } break;
    case 'reset-stats':
      if (t.dataset.sure) { S.stats = C.newStats(); saveStats(); closeSheet(); toast('Stats reset'); }
      else { t.dataset.sure = '1'; t.textContent = 'Tap again to reset stats'; }
      break;
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'dealForm') {
    const n = parseInt($('#dealIn').value, 10);
    if (!(n >= 1 && n <= 999999)) { toast('Enter a deal number from 1 to 999999'); return; }
    closeSheet(); newGame(n, S.nd.draw);
  }
});
$('#themeBtn').addEventListener('click', () => togglePop('themes'));
$('#statsBtn').addEventListener('click', () => togglePop('statsPop'));
$('#settingsBtn').addEventListener('click', () => openSettings());
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  for (const id in POPS) if (!$('#' + id).hidden) { togglePop(id, false); $(POPS[id]).focus(); }
});

new ResizeObserver(() => sync()).observe($('#stage'));
window.addEventListener('resize', () => sync());
window.addEventListener('orientationchange', () => setTimeout(sync, 120));

document.addEventListener('visibilitychange', () => {
  if (!S.g) return;
  if (document.visibilityState === 'hidden') { pauseClock(); save(); } else resumeClock();
});
window.addEventListener('pagehide', () => { if (S.g) { pauseClock(); save(); } });
setInterval(() => { if (S.g && S.g.t0) { const t = fmtTime(elapsed()), el = $('#vTime'); if (el.textContent !== t) el.textContent = t; } }, 500);

/* ---------- Start ---------- */
(function start() {
  setTheme(S.set.theme);
  buildBoard();
  const resumed = loadGame();
  if (!resumed) freshGame(randSeed(), S.set.draw);
  S.statMode = S.g.s.draw;
  renderNotices();
  sync();
  updateHud(); updateDock();
  if (!resumed) { save(); dealAnimation(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
</html>
